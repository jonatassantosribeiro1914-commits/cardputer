; Dois firmwares para M5Stack Cardputer e Cardputer ADV (S3A)
;
;  [cardputer]  Controle Philips Ambilight + HTV 8   -> pasta src/philips
;  [universal]  Controle IR universal (le arquivos .ir do cartao SD)
;                                                     -> pasta src/universal
;
; Compilar um:   pio run -e universal
; Gravar:        pio run -e universal -t upload

[common]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:cardputer]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<philips/>
build_flags =
    ${common.build_flags}
    -DUSE_NIMBLE
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
    m5stack/M5Unified@>=0.3.0
    m5stack/M5GFX@>=0.3.0
    crankyoldgit/IRremoteESP8266@^2.8.6
    t-vk/ESP32 BLE Keyboard@^0.3.2
    h2zero/NimBLE-Arduino@~1.4.3

[env:universal]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<universal/>
build_flags = ${common.build_flags}
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
    m5stack/M5Unified@>=0.3.0
    m5stack/M5GFX@>=0.3.0
    crankyoldgit/IRremoteESP8266@^2.8.6
