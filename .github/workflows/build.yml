name: Build firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publicar uma release com este nome (ex.: v1.0.0). Vazio = so build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar os dois firmwares
        run: pio run

      - name: Gerar binarios (USB em 0x0 e Launcher para o SD)
        run: |
          PKG=~/.platformio/packages
          merge() {
            env=$1; out=$2
            B=.pio/build/$env
            python $PKG/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
              -o $out-cardputer.bin \
              0x0 $B/bootloader.bin \
              0x8000 $B/partitions.bin \
              0xe000 $PKG/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 $B/firmware.bin
            cp $B/firmware.bin $out-launcher.bin
          }
          merge cardputer onetap-tv
          merge universal onetap-ir

      - name: Montar ZIP do pacote de controles para o SD
        run: |
          cd cartao-sd && zip -r -q ../controles-ir-sd.zip . && cd ..
          ls -lh controles-ir-sd.zip

      - uses: actions/upload-artifact@v4
        with:
          name: firmwares
          path: |
            onetap-tv-cardputer.bin
            onetap-tv-launcher.bin
            onetap-ir-cardputer.bin
            onetap-ir-launcher.bin

      - name: Publicar na Release "ultima-versao"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao \
            onetap-ir-launcher.bin onetap-ir-cardputer.bin \
            onetap-tv-launcher.bin onetap-tv-cardputer.bin \
            controles-ir-sd.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "OneTap IR - ultima versao" \
            --notes "onetap-ir-launcher.bin: OneTap IR (le .ir do cartao SD), para instalar pelo Launcher. onetap-tv-launcher.bin: OneTap TV (Philips Ambilight + HTV 8). Os arquivos *-cardputer.bin sao para gravar via USB no endereco 0x0. controles-ir-sd.zip: pacote de controles (TVs + ar-condicionado) para descompactar no cartao SD."

      - name: Publicar Release versionada (tag v* ou dispatch com versao)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ inputs.release_version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME}"; fi
          cat > NOTAS.md <<EOF
          # OneTap IR $VER

          OneTap IR transforma o M5Stack Cardputer (e o Cardputer ADV / S3A) num
          controle remoto infravermelho com **um toque por botao**: cada funcao numa
          tecla, sem ficar rolando menu pra achar o volume. TVs, ar-condicionado e mais.

          ## Como instalar (escolha um)
          - **Pelo cartao SD (Launcher):** copie \`onetap-ir-launcher.bin\`
            para o SD e no Launcher: SD > arquivo > Install.
          - **Pelo USB (navegador):** abra https://espressif.github.io/esptool-js/ no
            Chrome ou Edge, conecte o Cardputer, e grave \`onetap-ir-cardputer.bin\`
            no endereco **0x0** (chip ESP32-S3).

          ## Arquivos
          | Arquivo | Para que serve |
          |---|---|
          | onetap-ir-launcher.bin | OneTap IR (le .ir do SD) - instalar pelo Launcher |
          | onetap-ir-cardputer.bin | O mesmo, para gravar via USB em 0x0 |
          | onetap-tv-launcher.bin | OneTap TV (Philips Ambilight + HTV 8) - pelo Launcher |
          | onetap-tv-cardputer.bin | O mesmo, via USB em 0x0 |
          | controles-ir-sd.zip | Pacote de controles (TVs + ar-condicionado) para o cartao SD |

          Idiomas: Portugues, Espanol, English. Codigos IR do banco Flipper-IRDB.
          EOF
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" \
              onetap-ir-launcher.bin onetap-ir-cardputer.bin \
              onetap-tv-launcher.bin onetap-tv-cardputer.bin \
              controles-ir-sd.zip --clobber
            gh release edit "$VER" --title "OneTap IR $VER" --notes-file NOTAS.md
          else
            gh release create "$VER" \
              onetap-ir-launcher.bin onetap-ir-cardputer.bin \
              onetap-tv-launcher.bin onetap-tv-cardputer.bin \
              controles-ir-sd.zip \
              --target "$GITHUB_SHA" \
              --title "OneTap IR $VER" \
              --notes-file NOTAS.md
          fi
