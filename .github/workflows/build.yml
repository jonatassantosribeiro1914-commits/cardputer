name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar
        run: pio run

      - name: Gerar binario unico (gravar em 0x0)
        run: |
          B=.pio/build/cardputer
          PKG=~/.platformio/packages
          python $PKG/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o controle-philips-cardputer.bin \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 $PKG/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          cp $B/firmware.bin controle-philips-launcher.bin

      - uses: actions/upload-artifact@v4
        with:
          name: controle-philips-cardputer
          path: |
            controle-philips-cardputer.bin
            controle-philips-launcher.bin

      - name: Publicar na Release "ultima-versao"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao \
            controle-philips-launcher.bin controle-philips-cardputer.bin \
            --target "$GITHUB_SHA" --prerelease \
            --title "Controle Philips Ambilight - ultima versao" \
            --notes "controle-philips-launcher.bin: para instalar pelo cartao SD com o Launcher. controle-philips-cardputer.bin: binario completo para gravar via USB no endereco 0x0."
