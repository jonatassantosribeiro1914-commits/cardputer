name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar os dois firmwares
        run: pio run

      - name: Gerar binarios (USB em 0x0 e Launcher para o SD)
        run: |
          PKG=~/.platformio/packages
          merge() {
            env=$1; out=$2
            B=.pio/build/$env
            python $PKG/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
              -o $out-cardputer.bin \
              0x0 $B/bootloader.bin \
              0x8000 $B/partitions.bin \
              0xe000 $PKG/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 $B/firmware.bin
            cp $B/firmware.bin $out-launcher.bin
          }
          merge cardputer controle-tv
          merge universal controle-ir-universal

      - name: Montar ZIP do pacote de controles para o SD
        run: |
          cd cartao-sd && zip -r -q ../controles-ir-sd.zip . && cd ..
          ls -lh controles-ir-sd.zip

      - uses: actions/upload-artifact@v4
        with:
          name: firmwares
          path: |
            controle-tv-cardputer.bin
            controle-tv-launcher.bin
            controle-ir-universal-cardputer.bin
            controle-ir-universal-launcher.bin

      - name: Publicar na Release "ultima-versao"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao \
            controle-ir-universal-launcher.bin controle-ir-universal-cardputer.bin \
            controle-tv-launcher.bin controle-tv-cardputer.bin \
            controles-ir-sd.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Firmwares Cardputer - ultima versao" \
            --notes "controle-ir-universal-launcher.bin: controle IR universal (le .ir do cartao SD), para instalar pelo Launcher. controle-tv-launcher.bin: controle Philips + HTV 8. Os arquivos *-cardputer.bin sao para gravar via USB no endereco 0x0. controles-ir-sd.zip: pacote de controles (TVs + ar-condicionado) para descompactar no cartao SD."
